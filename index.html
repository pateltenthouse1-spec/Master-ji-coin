<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - Viral Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; touch-action: manipulation; overflow: hidden; font-family: sans-serif; color: white; }
        .gold-bg { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
        .floating-text { position: absolute; font-weight: bold; font-size: 32px; color: #ffd700; pointer-events: none; animation: floatUp 0.7s forwards; z-index: 100; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="loginOverlay" class="fixed inset-0 bg-black z-[2000] flex flex-col items-center justify-center p-6 hidden">
        <h1 class="text-4xl font-black text-yellow-500 mb-8 italic text-center uppercase tracking-tighter leading-none">Master Ji<br>Empire</h1>
        <input type="text" id="nameInp" placeholder="अपना नाम लिखें..." class="bg-gray-900 border-2 border-yellow-600 rounded-2xl px-4 py-4 text-center text-yellow-400 text-xl w-full max-w-xs outline-none mb-6">
        <button onclick="login()" class="gold-bg text-black font-black py-4 w-full max-w-xs rounded-2xl text-xl uppercase shadow-lg">Enter Empire 👑</button>
    </div>

    <div id="gameUI" class="flex flex-col h-screen hidden">
        <div class="p-4 flex justify-between items-center glass border-b border-yellow-900/20">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-yellow-600 flex items-center justify-center font-bold text-black border-2 border-yellow-400" id="avatar">A</div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase" id="uName">User</p>
                    <p class="text-[10px] text-yellow-500 font-black italic" id="rankDisplay">Bronze Miner</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-gray-400 uppercase font-black tracking-tighter">Profit/Hr</p>
                <p class="text-xs font-bold text-green-400" id="pphDisplay">+50,000 💰</p>
            </div>
        </div>

        <div class="flex flex-col items-center py-6">
            <div class="flex items-center gap-3 bg-gray-900/50 px-6 py-2 rounded-full border border-yellow-600/20 mb-3">
                <span class="text-2xl">💰</span>
                <span class="text-4xl font-black text-yellow-400 tracking-tight" id="bal">0</span>
            </div>
            <div class="w-64 h-2 bg-gray-800 rounded-full overflow-hidden border border-gray-700 shadow-inner">
                <div class="bg-blue-500 h-full transition-all duration-500" id="lvlBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto px-4 pb-32">
            <div id="exchange" class="tab-content active h-full flex flex-col items-center justify-center pt-4">
                <div id="tapBtn" class="w-72 h-72 rounded-full bg-gradient-to-b from-gray-800 to-black border-[10px] border-yellow-700/30 flex items-center justify-center text-[180px] shadow-[0_0_100px_rgba(255,215,0,0.1)] active:scale-90 transition-transform cursor-pointer">🪙</div>
                
                <button onclick="shareGame()" class="mt-6 bg-green-600 px-8 py-3 rounded-2xl text-xs font-black uppercase flex items-center gap-2 border border-green-400 shadow-lg active:scale-95 transition-all">
                    📲 Share & Earn 50k 💰
                </button>

                <div class="flex gap-4 mt-6">
                    <button onclick="applyBoost()" class="bg-blue-600 px-6 py-3 rounded-2xl text-[11px] font-black uppercase border border-blue-400 shadow-md">🚀 Boost</button>
                    <button onclick="energy = 1000; updateUI(); saveAll();" class="bg-orange-600 px-6 py-3 rounded-2xl text-[11px] font-black uppercase border border-orange-400 shadow-md">⚡ Tank</button>
                </div>
            </div>

            <div id="leaderboard" class="tab-content pt-4">
                <h2 class="text-2xl font-black text-yellow-500 text-center italic uppercase mb-8">Top Rankers 🏆</h2>
                <div class="glass p-4 rounded-xl flex justify-between items-center border-l-4 border-yellow-500 bg-yellow-500/5">
                    <span class="text-xl">🥇</span>
                    <span class="font-bold flex-grow ml-4 text-yellow-400" id="rank1Name">Asif Khan Multani</span>
                    <span class="font-black" id="rank
