<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - SEASON 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; touch-action: manipulation; overflow: hidden; font-family: sans-serif; color: white; }
        .gold-bg { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
        .floating-text { position: absolute; font-weight: bold; font-size: 32px; color: #ffd700; pointer-events: none; animation: floatUp 0.7s forwards; z-index: 100; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="loginOverlay" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center p-6">
        <h2 class="text-yellow-500 font-bold mb-2 tracking-widest">SEASON 2 IS HERE</h2>
        <h1 class="text-4xl font-black text-white mb-8 italic text-center uppercase tracking-tighter">Master Ji<br>Empire</h1>
        <input type="text" id="nameInp" placeholder="अपना नाम लिखें..." class="bg-gray-900 border-2 border-yellow-600 rounded-2xl px-4 py-4 text-center text-yellow-400 text-xl w-full max-w-xs outline-none mb-6">
        <button onclick="login()" class="gold-bg text-black font-black py-4 w-full max-w-xs rounded-2xl text-xl uppercase shadow-lg">Enter Season 2 👑</button>
    </div>

    <div id="gameUI" class="flex flex-col h-full opacity-0 transition-opacity duration-500">
        <div class="p-4 flex justify-between items-center glass">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-yellow-600 flex items-center justify-center font-bold text-black border-2 border-yellow-400" id="avatar">A</div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase" id="uName">Loading...</p>
                    <p class="text-[10px] text-yellow-500 font-black italic">Rank: Season 2 Miner</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-gray-400 uppercase font-black">Profit/Hr</p>
                <p class="text-xs font-bold text-green-400" id="pphDisplay">+1,000 💰</p>
            </div>
        </div>

        <div class="flex flex-col items-center py-6">
            <div class="flex items-center gap-3 bg-gray-900/50 px-6 py-2 rounded-full border border-yellow-600/20 mb-3">
                <span class="text-2xl">💰</span>
                <span class="text-4xl font-black text-yellow-400 tracking-tight" id="bal">0</span>
            </div>
            <div class="w-64 h-2 bg-gray-800 rounded-full overflow-hidden"><div class="bg-blue-600 h-full" id="lvlBar" style="width: 0%"></div></div>
        </div>

        <div class="flex-grow flex flex-col items-center justify-center pb-20">
            <div id="tapBtn" class="w-72 h-72 rounded-full bg-gradient-to-b from-gray-800 to-black border-[10px] border-yellow-700/30 flex items-center justify-center text-[160px] shadow-2xl active:scale-90 transition-transform cursor-pointer">🪙</div>
            
            <div class="flex gap-4 mt-8">
                <button onclick="useBoost('2x')" class="bg-blue-600 px-6 py-3 rounded-2xl text-[11px] font-black uppercase border border-blue-400">🚀 Boost 2X</button>
                <button onclick="useBoost('tank')" class="bg-orange-600 px-6 py-3 rounded-2xl text-[11px] font-black uppercase border border-orange-400">⚡ Tank</button>
            </div>
        </div>

        <div class="fixed bottom-10 left-8 font-black flex items-center gap-2">
            <span class="text-2xl">⚡</span>
            <span id="en" class="text-xl">1000</span>
        </div>
    </div>

    <script>
        let balance = 0; let energy = 1000; let tapVal = 1; let pph = 1000;
        let currentUser = "";
        let lastBoost = 0;
        const adminName = "asif khan multani";

        function login() {
            let n = document.getElementById('nameInp').value.trim().toLowerCase();
            if (!n) return;
            currentUser = n;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('gameUI').classList.remove('opacity-0');
            document.getElementById('uName').innerText = n.toUpperCase();
            document.getElementById('avatar').innerText = n[0].toUpperCase();

            if (n === adminName) {
                balance = 100000000; tapVal = 1000; pph = 100000;
            } else if (n === "sufiyan") {
                // सुफ़ियान के लिए ज़ीरो से शुरुआत
                balance = 0; tapVal = 1; pph = 500;
                alert("Season 2 में आपका स्वागत है सुफ़ियान! इस बार कोई चालाकी नहीं। 👑");
            } else {
                // नए सीजन का फ्रेश डेटा (v7)
                let saved = localStorage.getItem('mjc_season2_v7_' + n);
                if (saved) {
                    let d = JSON.parse(saved);
                    balance = d.balance || 0;
                    pph = d.pph || 1000;
                }
            }
            updateUI();
        }

        function useBoost(type) {
            let now = Date.now();
            if (now - lastBoost < 3600000) { // 1 घंटे का Cooldown
                let mins = Math.ceil((3600000 - (now - lastBoost))/60000);
                alert("इंतज़ार करें! मास्टर जी ने बूस्ट पर रोक लगाई है। " + mins + " मिनट बाकी।");
                return;
            }
            if (type === '2x') { tapVal *= 2; setTimeout(() => tapVal = (currentUser === adminName ? 1000 : 1), 20000); }
            else { energy = 1000; }
            lastBoost = now;
            updateUI();
        }

        function updateUI() {
            document.getElementById('bal').innerText = balance.toLocaleString();
            document.getElementById('en').innerText = energy;
            document.getElementById('pphDisplay').innerText = "+" + pph.toLocaleString() + " 💰";
            document.getElementById('lvlBar').style.width = (balance % 10000 / 100) + "%";
        }

        document.getElementById('tapBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy >= (tapVal > 100 ? 1 : tapVal)) {
                balance += tapVal; energy -= (tapVal > 100 ? 1 : tapVal);
                let t = e.touches[0];
                let f = document.createElement('div');
                f.className = 'floating-text'; f.innerText = "+" + tapVal;
                f.style.left = t.pageX + 'px'; f.style.top = t.pageY + 'px';
                document.body.appendChild(f); setTimeout(() => f.remove(), 700);
                updateUI();
                if (currentUser !== adminName) localStorage.setItem('mjc_season2_v7_' + currentUser, JSON.stringify({balance, pph}));
            }
        });

        setInterval(() => { if (energy < 1000) energy += 2; updateUI(); }, 2000);
    </script>
</body>
</html>
