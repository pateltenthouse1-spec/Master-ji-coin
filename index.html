<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC Season 2 - Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; touch-action: manipulation; overflow: hidden; font-family: sans-serif; color: white; margin: 0; }
        .gold-bg { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .tab-content { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .tab-content.active { display: flex; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
        .floating-text { position: absolute; font-weight: bold; font-size: 32px; color: #ffd700; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 100; text-shadow: 0 0 10px rgba(255,215,0,0.8); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="loginOverlay" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center p-6">
        <h1 class="text-4xl font-black text-yellow-500 mb-8 italic text-center uppercase tracking-tighter">Master Ji<br>Empire</h1>
        <input type="text" id="nameInp" placeholder="अपना नाम लिखें..." class="bg-gray-900 border-2 border-yellow-600 rounded-2xl px-4 py-4 text-center text-yellow-400 text-xl w-full max-w-xs outline-none mb-6">
        <button onclick="login()" class="gold-bg text-black font-black py-4 w-full max-w-xs rounded-2xl text-xl uppercase shadow-lg active:scale-95 transition-all">Enter Empire 👑</button>
    </div>

    <div id="gameUI" class="flex flex-col h-full w-full" style="display: none;">
        <div class="p-4 flex justify-between items-center glass">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-yellow-600 flex items-center justify-center font-bold text-black border-2 border-yellow-400" id="avatar">?</div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase" id="uName">Loading...</p>
                    <p class="text-[10px] text-yellow-500 font-black italic" id="rankDisplay">Season 2 Miner</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-gray-400 uppercase font-black tracking-tighter">Profit/Hr</p>
                <p class="text-xs font-bold text-green-400" id="pphDisplay">+1,000 💰</p>
            </div>
        </div>

        <div class="flex flex-col items-center py-6">
            <div class="flex items-center gap-3 bg-gray-900/50 px-6 py-2 rounded-full border border-yellow-600/20 mb-3">
                <span class="text-2xl">💰</span>
                <span class="text-4xl font-black text-yellow-400 tracking-tight" id="bal">0</span>
            </div>
            <div class="w-64 h-2 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
                <div class="bg-blue-600 h-full transition-all duration-500" id="lvlBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="flex-grow overflow-hidden relative flex flex-col items-center">
            <div id="exchange" class="tab-content active pt-4">
                <div id="tapBtn" class="w-72 h-72 rounded-full bg-gradient-to-b from-gray-800 to-black border-[10px] border-yellow-700/30 flex items-center justify-center text-[160px] shadow-2xl active:scale-90 transition-transform cursor-pointer">🪙</div>
                
                <button onclick="shareGame()" class="mt-6 bg-green-600 px-8 py-3 rounded-2xl text-xs font-black uppercase flex items-center gap-2 border border-green-400 shadow-lg active:scale-95">📲 Share & Earn 50k 💰</button>

                <div class="flex gap-4 mt-6">
                    <button onclick="useBoost('2x')" class="bg-blue-600 px-6 py-3 rounded-2xl text-[11px] font-black uppercase border border-blue-400 shadow-lg">🚀 Boost 2X</button>
                    <button onclick="useBoost('tank')" class="bg-orange-600 px-6 py-3 rounded-2xl text-[11px] font-black uppercase border border-orange-400 shadow-lg">⚡ Tank</button>
                </div>
            </div>

            <div id="leaderboard" class="tab-content pt-10 px-6">
                <h2 class="text-2xl font-black text-yellow-500 italic uppercase mb-8 text-center">Top Emperors 🏆</h2>
                <div class="w-full glass p-4 rounded-xl flex justify-between items-center border-l-4 border-yellow-500 mb-3">
                    <span class="text-xl">🥇</span>
                    <span class="font-bold flex-grow ml-4 text-yellow-400" id="rank1Name">Asif Khan Multani</span>
                    <span class="font-black" id="rank1Score">100M+</span>
                </div>
                <div class="w-full glass p-4 rounded-xl flex justify-between items-center border-l-4 border-gray-500">
                    <span class="text-xl">🥈</span>
                    <span class="font-bold flex-grow ml-4">Aman Khan</span>
                    <span class="font-bold">25.4M</span>
                </div>
            </div>
        </div>

        <div class="p-6 flex items-center gap-2 mb-20">
            <span class="text-2xl">⚡</span>
            <span id="en" class="text-xl font-black">1000</span> <span class="text-gray-500 text-xs">/ 1000</span>
        </div>

        <div class="fixed bottom-6 left-6 right-6 h-16 glass rounded-2xl flex items-center justify-around z-5
