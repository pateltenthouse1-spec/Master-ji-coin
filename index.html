<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - Master Ji Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; touch-action: manipulation; overflow: hidden; font-family: sans-serif; }
        #loginOverlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 9999; display: flex; flex-direction: column; items-center; justify-content: center; padding: 20px; }
        .gold-btn { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
        .floating-text { position: absolute; color: #ffd700; font-weight: bold; font-size: 32px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen pb-6 text-white select-none">

    <div id="loginOverlay">
        <h2 class="text-4xl font-black text-yellow-500 mb-10 italic tracking-widest text-center uppercase">Master Ji Empire</h2>
        <div class="w-full max-w-xs space-y-6 relative z-[10000]">
            <input type="text" id="userNameInput" placeholder="लिखिए अपना नाम..." 
                   class="w-full bg-gray-900 border-2 border-yellow-600 rounded-2xl px-4 py-5 text-center text-yellow-400 text-2xl outline-none shadow-2xl mb-4">
            
            <div id="loginBtn" onclick="startGame()" ontouchstart="startGame()"
                    class="gold-btn w-full py-5 rounded-2xl font-black text-black text-2xl uppercase tracking-widest text-center cursor-pointer active:scale-95 transition-all">
                ENTER EMPIRE 👑
            </div>
        </div>
        <p class="mt-12 text-gray-600 text-[10px] tracking-widest italic uppercase">Master Ji Official System 👑</p>
    </div>

    <div id="gameUI" class="hidden w-full h-full flex flex-col items-center justify-between p-4">
        <div class="w-full text-center">
            <h1 class="text-2xl font-black text-yellow-500 uppercase italic">Master Ji Empire</h1>
            <div class="mt-4 px-10">
                <div class="flex justify-between text-[10px] font-bold text-gray-400 mb-1">
                    <span id="levelText">Level 1/5</span>
                    <span id="nextRank">Next: Silver</span>
                </div>
                <div class="w-full bg-gray-900 h-2 rounded-full overflow-hidden border border-gray-800">
                    <div id="levelBar" class="bg-blue-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
            <div class="flex items-center justify-center mt-6 bg-yellow-900/20 py-3 rounded-full border border-yellow-600/30 mx-6">
                <span class="text-3xl mr-2">💰</span>
                <span id="balance" class="text-4xl font-black text-yellow-400">0</span>
            </div>
            <p class="text-gray-400 mt-2 text-[10px] font-bold tracking-widest uppercase"><span id="uNameDisplay">User</span> | <span id="rankName">Miner</span></p>
        </div>

        <div id="coinBtn" class="w-72 h-72 flex items-center justify-center cursor-pointer transition-transform duration-75 active:scale-90 rounded-full bg-black/40 text-[160px] border-8 border-yellow-700/20 shadow-[0_0_80px_rgba(255,215,0,0.1)]">🪙</div>

        <div class="w-full px-8">
            <p class="text-yellow-500 text-[10px] font-black uppercase mb-1">⚡ Energy</p>
            <div class="w-full bg-black h-4 rounded-full border border-yellow-900/50">
                <div id="energyBar" class="bg-gradient-to-r from-yellow-700 to-yellow-400 h-full w-full"></div>
            </div>
            <p class="text-center mt-2 font-bold text-xl"><span id="energy">1000</span> / 1000</p>
        </div>
    </div>

    <script>
        let balance = 0; let energy = 1000; let tapValue = 1; const maxEnergy = 1000;
        const adminNames = ["asif khan multani", "aasif khan multani"]; // दोनों स्पेलिंग काम करेंगी

        function startGame() {
            let nameInput = document.getElementById('userNameInput').value.trim().toLowerCase();
            if (!nameInput) return;

            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('gameUI').classList.remove('hidden');
            document.getElementById('uNameDisplay').innerText = nameInput.toUpperCase();

            if (adminNames.includes(nameInput)) {
                balance = 100000000; tapValue = 1000;
            } else {
                balance = parseInt(localStorage.getItem('mjc_bal_' + nameInput)) || 0;
            }
            updateUI();
        }

        function updateProgress() {
            let progress = 0; let currentRank = "Bronze Miner"; let lvl = "1/5";
            if (balance >= 500000) { currentRank = "MJC Emperor 👑"; progress = 100; lvl = "5/5"; }
            else if (balance >= 100000) { currentRank = "Platinum King"; progress = ((balance-100000)/400000)*100; lvl = "4/5"; }
            else if (balance >= 25000) { currentRank = "Gold Miner"; progress = ((balance-25000)/75000)*100; lvl = "3/5"; }
            else if (balance >= 5000) { currentRank = "Silver Miner"; progress = ((balance-5000)/20000)*100; lvl = "2/5"; }
            else { progress = (balance / 5000) * 100; }
            document.getElementById('rankName').innerText = currentRank;
            document.getElementById('levelText').innerText = `Level ${lvl}`;
            document.getElementById('levelBar').style.width = `${progress}%`;
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('energy').innerText = energy;
            document.getElementById('energyBar').style.width = (energy / maxEnergy * 100) + '%';
            updateProgress();
        }

        document.getElementById('coinBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy >= 1) {
                balance += tapValue; energy -= 1;
                const t = e.touches[0];
                const f = document.createElement('div');
                f.innerText = `+${tapValue}`; f.className = 'floating-text';
                f.style.left = t.pageX + 'px'; f.style.top = t.pageY + 'px';
                document.body.appendChild(f); setTimeout(() => f.remove(), 800);
                updateUI(); saveData();
            }
        });

        function saveData() {
            let name = document.getElementById('uNameDisplay').innerText.toLowerCase();
            if (!adminNames.includes(name)) { localStorage.setItem('mjc_bal_' + name, balance); }
        }

        setInterval(() => { if (energy < maxEnergy) { energy += 5; updateUI(); } }, 1000);
        updateUI();
    </script>
</body>
</html>
