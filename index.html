<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - Master Ji Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); touch-action: manipulation; overflow: hidden; }
        .gold-glow { box-shadow: 0 0 60px rgba(255, 215, 0, 0.3); }
        .coin-tap:active { transform: scale(0.90); }
        .floating-text {
            position: absolute; color: #ffd700; font-weight: bold; font-size: 28px;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-120px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen pb-10 text-white select-none">

    <div class="w-full p-6 text-center">
        <h1 class="text-3xl font-black tracking-widest text-yellow-500 uppercase italic">Master Ji Empire</h1>
        <div class="flex items-center justify-center mt-6 bg-gray-900/50 py-2 rounded-full border border-yellow-900/30 mx-10">
            <img src="https://i.ibb.co/XfXvXh8/mjc-gold-coin.png" class="w-10 h-10 mr-3">
            <span id="balance" class="text-5xl font-black text-yellow-400">0</span>
        </div>
        <p class="text-gray-400 mt-3 text-sm tracking-widest">RANK: <span id="level" class="text-yellow-200 font-bold uppercase">Bronze Miner</span></p>
    </div>

    <div class="relative">
        <div class="absolute inset-0 bg-yellow-500/10 rounded-full blur-3xl"></div>
        <img id="coinBtn" src="https://i.ibb.co/XfXvXh8/mjc-gold-coin.png" 
             class="w-72 h-72 cursor-pointer transition-transform duration-75 coin-tap gold-glow rounded-full border-4 border-yellow-600/20 relative z-10">
    </div>

    <div class="w-full px-10 mb-6">
        <div class="flex justify-between mb-3 font-bold text-yellow-500/80 tracking-tighter">
            <span class="flex items-center">⚡ <span id="energy" class="ml-1">1000</span> / 1000</span>
            <span class="animate-pulse">MASTER JI 👑</span>
        </div>
        <div class="w-full bg-gray-900 h-5 rounded-full overflow-hidden border-2 border-gray-800 shadow-inner">
            <div id="energyBar" class="bg-gradient-to-r from-yellow-700 via-yellow-400 to-yellow-700 h-full w-full transition-all duration-300"></div>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('mjc_bal')) || 0;
        let energy = parseInt(localStorage.getItem('mjc_energy')) || 1000;
        const maxEnergy = 1000;

        const balEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const energyBar = document.getElementById('energyBar');
        const coinBtn = document.getElementById('coinBtn');

        function updateUI() {
            balEl.innerText = balance.toLocaleString();
            energyEl.innerText = energy;
            energyBar.style.width = (energy / maxEnergy * 100) + '%';
        }

        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                
                const touch = e.touches[0];
                const text = document.createElement('div');
                text.innerText = '+1';
                text.className = 'floating-text';
                text.style.left = touch.pageX + 'px';
                text.style.top = touch.pageY + 'px';
                document.body.appendChild(text);
                setTimeout(() => text.remove(), 800);

                updateUI();
                saveData();
            }
        });

        function saveData() {
            localStorage.setItem('mjc_bal', balance);
            localStorage.setItem('mjc_energy', energy);
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                updateUI();
                saveData();
            }
        }, 1500);

        updateUI();
    </script>
</body>
</html>
