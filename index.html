<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - Master Ji Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); touch-action: manipulation; overflow: hidden; }
        .gold-glow { box-shadow: 0 0 80px rgba(255, 215, 0, 0.2); }
        .coin-tap:active { transform: scale(0.85); }
        .floating-text {
            position: absolute; color: #ffd700; font-weight: bold; font-size: 32px;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(255,215,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-120px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen pb-10 text-white select-none">

    <div class="w-full p-6 text-center">
        <h1 class="text-3xl font-black tracking-widest text-yellow-500 uppercase italic drop-shadow-lg">Master Ji Empire</h1>
        <div class="flex items-center justify-center mt-6 bg-yellow-900/20 py-2 rounded-full border border-yellow-600/30 mx-10 shadow-lg">
            <span class="text-3xl mr-2">💰</span>
            <span id="balance" class="text-5xl font-black text-yellow-400">0</span>
        </div>
        <p class="text-gray-400 mt-3 text-xs tracking-[0.3em] font-bold">RANK: <span id="level" class="text-yellow-200">BRONZE MINER</span></p>
    </div>

    <div class="relative flex items-center justify-center">
        <div class="absolute w-64 h-64 bg-yellow-500/20 rounded-full blur-3xl"></div>
        <div id="coinBtn" class="w-72 h-72 flex items-center justify-center cursor-pointer transition-transform duration-75 coin-tap gold-glow rounded-full border-8 border-yellow-700/20 relative z-10 bg-black/40 text-[180px]">
            🪙
        </div>
    </div>

    <div class="w-full px-10 mb-6">
        <div class="flex justify-between mb-3 font-black text-yellow-500 text-sm tracking-tighter">
            <span class="flex items-center drop-shadow">⚡ <span id="energy" class="ml-1">1000</span> / 1000</span>
            <span class="animate-pulse tracking-[0.2em]">MASTER JI 👑</span>
        </div>
        <div class="w-full bg-black h-5 rounded-full overflow-hidden border-2 border-yellow-900/50 shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]">
            <div id="energyBar" class="bg-gradient-to-r from-yellow-800 via-yellow-400 to-yellow-800 h-full w-full transition-all duration-300"></div>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('mjc_bal')) || 0;
        let energy = parseInt(localStorage.getItem('mjc_energy')) || 1000;
        const maxEnergy = 1000;

        const balEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const energyBar = document.getElementById('energyBar');
        const coinBtn = document.getElementById('coinBtn');

        function updateUI() {
            balEl.innerText = balance.toLocaleString();
            energyEl.innerText = energy;
            energyBar.style.width = (energy / maxEnergy * 100) + '%';
        }

        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                
                const touch = e.touches[0];
                const text = document.createElement('div');
                text.innerText = '+1';
                text.className = 'floating-text';
                text.style.left = touch.pageX + 'px';
                text.style.top = touch.pageY + 'px';
                document.body.appendChild(text);
                setTimeout(() => text.remove(), 800);

                updateUI();
                saveData();
            }
        });

        function saveData() {
            localStorage.setItem('mjc_bal', balance);
            localStorage.setItem('mjc_energy', energy);
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 2;
                if(energy > maxEnergy) energy = maxEnergy;
                updateUI();
                saveData();
            }
        }, 1500);

        updateUI();
    </script>
</body>
</html>
