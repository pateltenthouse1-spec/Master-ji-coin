<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - Master Ji Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); touch-action: manipulation; overflow: hidden; font-family: sans-serif; }
        .gold-glow { box-shadow: 0 0 80px rgba(255, 215, 0, 0.2); }
        .coin-tap:active { transform: scale(0.85); }
        .floating-text {
            position: absolute; color: #ffd700; font-weight: bold; font-size: 32px;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(255,215,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-120px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen pb-6 text-white select-none">

    <div class="w-full p-6 text-center">
        <h1 class="text-3xl font-black tracking-widest text-yellow-500 uppercase italic drop-shadow-lg">Master Ji Empire</h1>
        <div class="flex items-center justify-center mt-4 bg-yellow-900/20 py-2 rounded-full border border-yellow-600/30 mx-10 shadow-lg">
            <span class="text-3xl mr-2">💰</span>
            <span id="balance" class="text-4xl font-black text-yellow-400">0</span>
        </div>
        <p class="text-gray-400 mt-2 text-xs tracking-[0.3em] font-bold uppercase">Rank: <span id="level" class="text-yellow-200">Bronze Miner</span></p>
    </div>

    <div class="relative flex items-center justify-center">
        <div class="absolute w-64 h-64 bg-yellow-500/10 rounded-full blur-3xl"></div>
        <div id="coinBtn" class="w-64 h-64 flex items-center justify-center cursor-pointer transition-transform duration-75 coin-tap gold-glow rounded-full border-8 border-yellow-700/20 relative z-10 bg-black/40 text-[150px]">
            🪙
        </div>
    </div>

    <div class="w-full px-8">
        <div class="flex justify-between items-end mb-4">
            <div class="text-left">
                <p class="text-yellow-500 font-black text-sm mb-1">⚡ ENERGY</p>
                <p class="text-2xl font-bold"><span id="energy">1000</span><span class="text-gray-500 text-sm">/1000</span></p>
            </div>
            <button onclick="applyBoost()" class="bg-gradient-to-b from-yellow-400 to-yellow-700 px-6 py-2 rounded-xl font-black text-black shadow-lg active:scale-95 transition-all">
                BOOST 🚀
            </button>
        </div>
        
        <div class="w-full bg-black h-4 rounded-full overflow-hidden border border-yellow-900/50">
            <div id="energyBar" class="bg-gradient-to-r from-yellow-700 via-yellow-400 to-yellow-700 h-full w-full transition-all duration-300"></div>
        </div>
        
        <p class="text-center mt-4 text-gray-500 text-[10px] tracking-widest uppercase italic">Master Ji Official Project 👑</p>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('mjc_bal')) || 0;
        let energy = parseInt(localStorage.getItem('mjc_energy')) || 1000;
        let tapValue = 1; 
        const maxEnergy = 1000;

        const balEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const energyBar = document.getElementById('energyBar');
        const levelEl = document.getElementById('level');
        const coinBtn = document.getElementById('coinBtn');

        function checkRank() {
            if (balance > 500000) levelEl.innerText = "MJC Emperor 👑";
            else if (balance > 100000) levelEl.innerText = "Platinum King";
            else if (balance > 25000) levelEl.innerText = "Gold Miner";
            else if (balance > 5000) levelEl.innerText = "Silver Miner";
            else levelEl.innerText = "Bronze Miner";
        }

        function updateUI() {
            balEl.innerText = balance.toLocaleString();
            energyEl.innerText = energy;
            energyBar.style.width = (energy / maxEnergy * 100) + '%';
            checkRank();
        }

        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy >= tapValue) {
                balance += tapValue;
                energy -= tapValue;
                
                const touch = e.touches[0];
                showFloatingText(touch.pageX, touch.pageY, `+${tapValue}`);

                updateUI();
                saveData();
            }
        });

        function showFloatingText(x, y, val) {
            const text = document.createElement('div');
            text.innerText = val;
            text.className = 'floating-text';
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        function applyBoost() {
            if (balance >= 500) {
                balance -= 500;
                tapValue = 2; 
                energy = maxEnergy;
                alert("Boost Activated! Multi-tap +2 & Energy Refilled! 🚀");
                updateUI();
                saveData();
                setTimeout(() => { tapValue = 1; }, 60000); // 1 मिनट का बूस्ट
            } else {
                alert("You need 500 coins for a Boost! 💰");
            }
        }

        function saveData() {
            localStorage.setItem('mjc_bal', balance);
            localStorage.setItem('mjc_energy', energy);
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 2;
                if(energy > maxEnergy) energy = maxEnergy;
                updateUI();
                saveData();
            }
        }, 1500);

        updateUI();
    </script>
</body>
</html>
