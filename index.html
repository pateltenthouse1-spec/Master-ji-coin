<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - Master Ji Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; touch-action: manipulation; overflow: hidden; font-family: sans-serif; }
        #loginOverlay, #comboOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; items-center; justify-content: center; padding: 20px; }
        .gold-btn { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        .card-btn { background: #1a1a1a; border: 2px solid #333; height: 80px; width: 80px; display: flex; align-items: center; justify-content: center; border-radius: 15px; font-size: 30px; cursor: pointer; }
        .card-btn.selected { border-color: #ffd700; background: #2a2200; }
        .floating-text { position: absolute; color: #ffd700; font-weight: bold; font-size: 32px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen pb-6 text-white select-none">

    <div id="loginOverlay">
        <h2 class="text-4xl font-black text-yellow-500 mb-10 italic text-center uppercase">Master Ji Empire</h2>
        <input type="text" id="userNameInput" placeholder="नाम लिखिए..." class="w-full max-w-xs bg-gray-900 border-2 border-yellow-600 rounded-2xl px-4 py-5 text-center text-yellow-400 text-2xl outline-none mb-6">
        <div onclick="startGame()" class="gold-btn w-full max-w-xs py-5 rounded-2xl font-black text-black text-2xl uppercase text-center cursor-pointer">ENTER EMPIRE 👑</div>
    </div>

    <div id="comboOverlay" class="hidden">
        <h2 class="text-3xl font-black text-yellow-500 mb-2 uppercase">Daily Combo</h2>
        <p class="text-gray-400 text-sm mb-8 italic">सही 3 कार्ड चुनें और 5M जीतें!</p>
        <div class="flex gap-4 mb-10">
            <div onclick="pressCombo(1)" class="card-btn" id="c1">🃏</div>
            <div onclick="pressCombo(2)" class="card-btn" id="c2">💎</div>
            <div onclick="pressCombo(3)" class="card-btn" id="c3">🚀</div>
        </div>
        <div onclick="closeCombo()" class="text-yellow-600 font-bold border-b border-yellow-600 cursor-pointer">CLOSE</div>
    </div>

    <div id="gameUI" class="hidden w-full h-full flex flex-col items-center justify-between p-4">
        <div class="w-full text-center">
            <div class="flex justify-between items-center px-4">
                <h1 class="text-xl font-black text-yellow-500 italic">MJC EMPIRE</h1>
                <div onclick="openCombo()" class="bg-gray-800 px-4 py-2 rounded-lg border border-yellow-600 text-[10px] font-black text-yellow-400 animate-pulse cursor-pointer">🎁 DAILY COMBO</div>
            </div>
            
            <div class="mt-4 px-10">
                <div class="w-full bg-gray-900 h-2 rounded-full overflow-hidden border border-gray-800 mt-2">
                    <div id="levelBar" class="bg-blue-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>

            <div class="flex items-center justify-center mt-6 bg-yellow-900/20 py-3 rounded-full border border-yellow-600/30 mx-6 shadow-xl">
                <span class="text-3xl mr-2">💰</span>
                <span id="balance" class="text-4xl font-black text-yellow-400">0</span>
            </div>
            <p class="text-gray-400 mt-2 text-[10px] font-bold tracking-widest uppercase"><span id="uNameDisplay">User</span> | <span id="rankName">Miner</span></p>
        </div>

        <div id="coinBtn" class="w-72 h-72 flex items-center justify-center cursor-pointer transition-transform duration-75 active:scale-90 rounded-full bg-black/40 text-[160px] border-8 border-yellow-700/20 shadow-[0_0_80px_rgba(255,215,0,0.1)]">🪙</div>

        <div class="w-full px-8">
            <div class="flex justify-between text-[10px] font-black uppercase text-yellow-500 mb-1">
                <span>⚡ Energy</span>
                <span id="energy">1000 / 1000</span>
            </div>
            <div class="w-full bg-black h-3 rounded-full border border-yellow-900/50">
                <div id="energyBar" class="bg-gradient-to-r from-yellow-700 to-yellow-400 h-full w-full"></div>
            </div>
        </div>
    </div>

    <script>
        let balance = 0; let energy = 1000; let tapValue = 1; const maxEnergy = 1000;
        let comboInput = []; const secretCombo = [1, 2, 3];
        const adminNames = ["asif khan multani", "aasif khan multani"];

        function startGame() {
            let name = document.getElementById('userNameInput').value.trim().toLowerCase();
            if (!name) return;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('gameUI').classList.remove('hidden');
            document.getElementById('uNameDisplay').innerText = name.toUpperCase();
            if (adminNames.includes(name)) { balance = 100000000; tapValue = 1000; }
            else { balance = parseInt(localStorage.getItem('mjc_bal_' + name)) || 0; }
            updateUI();
        }

        function openCombo() { document.getElementById('comboOverlay').classList.remove('hidden'); }
        function closeCombo() { document.getElementById('comboOverlay').classList.add('hidden'); comboInput = []; }

        function pressCombo(id) {
            comboInput.push(id);
            document.getElementById('c' + id).classList.add('selected');
            if (comboInput.length === 3) {
                if (JSON.stringify(comboInput) === JSON.stringify(secretCombo)) {
                    balance += 5000000;
                    alert("WAH MASTER JI! 5,000,000 सिक्के आपके हुए! 🎉");
                    updateUI(); saveData();
                } else { alert("गलत कॉम्बो! कल फिर कोशिश करें।"); }
                closeCombo();
            }
        }

        function updateProgress() {
            let p = 0; let r = "Bronze Miner"; let l = "1/5";
            if (balance >= 500000) { r = "MJC Emperor 👑"; p = 100; l = "5/5"; }
            else if (balance >= 100000) { r = "Platinum King"; p = ((balance-100000)/400000)*100; l = "4/5"; }
            else { p = (balance / 5000) * 100; }
            document.getElementById('rankName').innerText = r;
            document.getElementById('levelBar').style.width = `${p}%`;
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('energy').innerText = `${energy} / ${maxEnergy}`;
            document.getElementById('energyBar').style.width = (energy / maxEnergy * 100) + '%';
            updateProgress();
        }

        document.getElementById('coinBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy >= 1) {
                balance += tapValue; energy -= 1;
                let t = e.touches[0];
                let f = document.createElement('div');
                f.innerText = `+${tapValue}`; f.className = 'floating-text';
                f.style.left = t.pageX + 'px'; f.style.top = t.pageY + 'px';
                document.body.appendChild(f); setTimeout(() => f.remove(), 800);
                updateUI(); saveData();
            }
        });

        function saveData() {
            let n = document.getElementById('uNameDisplay').innerText.toLowerCase();
            if (!adminNames.includes(n)) localStorage.setItem('mjc_bal_' + n, balance);
        }

        setInterval(() => { if (energy < maxEnergy) { energy += 5; updateUI(); } }, 1000);
        updateUI();
    </script>
</body>
</html>
