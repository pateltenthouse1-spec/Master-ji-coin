<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MJC - Safe & Secure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; touch-action: manipulation; overflow: hidden; font-family: sans-serif; color: white; }
        .gold-bg { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
        .floating-text { position: absolute; font-weight: bold; font-size: 30px; color: #ffd700; pointer-events: none; animation: floatUp 0.7s forwards; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div id="loginOverlay" class="fixed inset-0 bg-black z-[2000] flex flex-col items-center justify-center p-6">
        <h1 class="text-4xl font-black text-yellow-500 mb-8 italic text-center uppercase tracking-tighter leading-none">Master Ji<br>Empire</h1>
        <input type="text" id="nameInp" placeholder="अपना नाम लिखें..." class="bg-gray-900 border-2 border-yellow-600 rounded-2xl px-4 py-4 text-center text-yellow-400 text-xl w-full max-w-xs outline-none mb-6">
        <button onclick="login()" class="gold-bg text-black font-black py-4 w-full max-w-xs rounded-2xl text-xl uppercase shadow-lg">Enter 👑</button>
    </div>

    <div class="p-4 flex justify-between items-center glass">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-full bg-yellow-600 flex items-center justify-center font-bold text-black border-2 border-yellow-400" id="avatar">A</div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase" id="uName">User</p>
                <p class="text-[10px] text-yellow-500 font-black" id="rankDisplay">Bronze Miner</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-[9px] text-gray-400 uppercase font-black">Profit/Hr</p>
            <p class="text-xs font-bold text-green-400">+50,000 💰</p>
        </div>
    </div>

    <div class="flex flex-col items-center py-4">
        <div class="flex items-center gap-2 bg-gray-900/50 px-6 py-2 rounded-full border border-yellow-600/20 mb-2">
            <span class="text-2xl">💰</span>
            <span class="text-4xl font-black text-yellow-400" id="bal">0</span>
        </div>
        <div class="w-64 h-1.5 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
            <div class="bg-blue-600 h-full transition-all duration-500" id="lvlBar" style="width: 0%"></div>
        </div>
    </div>

    <div class="flex-grow flex flex-col items-center justify-center pb-32">
        <div id="tapBtn" class="w-72 h-72 rounded-full bg-gradient-to-b from-gray-800 to-black border-[10px] border-yellow-700/30 flex items-center justify-center text-[160px] shadow-2xl active:scale-90 transition-transform cursor-pointer">🪙</div>
        
        <div class="flex gap-4 mt-8">
            <button onclick="energy = 1000; updateUI();" class="bg-orange-600 px-6 py-3 rounded-2xl text-xs font-black uppercase border border-orange-400 active:scale-95 transition-all">⚡ Full Tank</button>
        </div>
    </div>

    <div class="fixed bottom-24 left-8 font-black flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <span id="en">1000</span> <span class="text-gray-500 text-xs">/ 1000</span>
    </div>

    <script>
        let balance = 0;
        let energy = 1000;
        let tapVal = 1;
        let currentUser = "";
        const adminName = "asif khan multani";

        function login() {
            let n = document.getElementById('nameInp').value.trim().toLowerCase();
            if (!n) return;

            currentUser = n;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('uName').innerText = n.toUpperCase();
            document.getElementById('avatar').innerText = n[0].toUpperCase();

            if (n === adminName) {
                // एडमिन के लिए हमेशा 10 करोड़ (सेव करने की ज़रूरत नहीं)
                balance = 100000000;
                tapVal = 1000;
            } else {
                // बाकी यूज़र्स के लिए पुराने डेटा को लोड करना
                let savedData = localStorage.getItem('mjc_user_' + n);
                if (savedData) {
                    let data = JSON.parse(savedData);
                    balance = data.balance || 0;
                    energy = data.energy || 1000;
                } else {
                    balance = 0;
                    energy = 1000;
                }
                tapVal = 1;
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('bal').innerText = balance.toLocaleString();
            document.getElementById('en').innerText = energy;
            document.getElementById('lvlBar').style.width = (balance % 10000 / 100) + "%";
            
            let r = "Bronze Miner";
            if (balance >= 1000000) r = "MJC Emperor 👑";
            document.getElementById('rankDisplay').innerText = r;
        }

        function saveData() {
            if (currentUser && currentUser !== adminName) {
                let data = {
                    balance: balance,
                    energy: energy
                };
                localStorage.setItem('mjc_user_' + currentUser, JSON.stringify(data));
            }
        }

        document.getElementById('tapBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy >= (tapVal > 100 ? 1 : tapVal)) {
                balance += tapVal;
                energy = Math.max(0, energy - (tapVal > 100 ? 1 : tapVal));
                
                let t = e.touches[0];
                let f = document.createElement('div');
                f.className = 'floating-text'; f.innerText = "+" + tapVal;
                f.style.left = t.pageX + 'px'; f.style.top = t.pageY + 'px';
                document.body.appendChild(f); setTimeout(() => f.remove(), 700);
                
                updateUI();
                saveData(); // हर टैप पर डेटा सेव होगा
            }
        });

        // हर 2 सेकंड में एनर्जी बढ़ेगी और ऑटो-सेव होगा
        setInterval(() => {
            if (energy < 1000) {
                energy += 5;
                updateUI();
                saveData();
            }
        }, 2000);

        updateUI();
    </script>
</body>
</html>
